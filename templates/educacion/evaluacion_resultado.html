{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado de evaluación</title>
    <link rel="stylesheet" href="{% static 'css/tesis-theme.css' %}">
</head>
<body>
    <div class="container page-shell">
        <div class="center-box" style="text-align: center;">
            <h1>Resultado de tu evaluación</h1>
            <p>Tu puntaje fue:</p>
            <div class="score" style="font-size: 2.5rem; font-weight: 800; color: var(--success); margin: 12px 0;">{{ puntaje }}/{{ total_preguntas }}</div>
            <p class="muted">Gracias por participar en la sensibilización ambiental.</p>
            <a class="btn" href="{% url 'educacion' %}">Volver a educación</a>
        </div>
    </div>
</body>
</html>
