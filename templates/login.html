{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'css/tesis-theme.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="container nav-inner">
            <div class="brand">
                <div class="brand-mark">E</div>
                <div>Eco<span>Track</span></div>
            </div>
            <nav class="nav-links">
                <a href="{% url 'home' %}">Inicio</a>
                <a class="btn-register" href="{% url 'register' %}">Registrarse</a>
            </nav>
        </div>
    </header>

    <div class="container page-shell">
        <div class="center-box">
            <div class="page-header" style="margin-bottom: 20px;">
                <h1>Iniciar sesión</h1>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}
                <div class="field">
                    {{ form.username.label_tag }}
                    {{ form.username }}
                </div>
                <div class="field">
                    {{ form.password.label_tag }}
                    {{ form.password }}
                </div>
                <button type="submit">Entrar</button>
            </form>
            <p style="margin-top: 16px; text-align: center;">
                ¿No tienes cuenta?
                <a href="{% url 'register' %}" style="font-weight: 600; color: var(--primary);">Regístrate aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
