{% extends 'base.html' %}
{% block title %}Nueva recolección{% endblock %}
{% block content %}
<div class="center-box">
    <div class="page-header" style="margin-bottom:20px;"><h1>Nueva recolección</h1></div>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="form-grid">
            {% for field in form %}
                <div class="field">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn">Guardar recolección</button>
        <a class="btn secondary" href="{% url 'recolecciones' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
